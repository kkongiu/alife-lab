name: M6.4 exact-cycle tracker v2

on:
  push:
    branches:
      - fix/m6-4-exact-cycle-tracker-v2
    paths:
      - 'src/alife/structures.py'
      - 'tests/test_exact_cycle_tracker_v2.py'
      - 'tools/m6_4_tracker_v2_audit.py'
      - '.github/workflows/m6_4_detector_v2.yml'
  pull_request:
    paths:
      - 'src/alife/structures.py'
      - 'tests/test_exact_cycle_tracker_v2.py'
      - 'tools/m6_4_tracker_v2_audit.py'
      - '.github/workflows/m6_4_detector_v2.yml'

permissions:
  contents: read

jobs:
  detector-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Full tests including v2 and legacy checkpoint invariants
        run: python -m pytest -q
      - name: Dual tracker natural-world audit (same historical 24 worlds)
        run: python -m tools.m6_4_tracker_v2_audit
      - name: Archive dual tracker per-world metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-4-detector-v2-evidence
          path: campaigns/m6_4_cycles/detector_v2_audit.json
          if-no-files-found: warn
