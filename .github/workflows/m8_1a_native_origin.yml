name: M8.1a preregistered source-free initial unbound monomer origin and informational controls

on:
  push:
    branches:
      - exp/m8-1a-unbound-native-origin
    paths:
      - 'campaigns/m8_1a/**'
      - 'tools/m8_1a_native_origin.py'
      - 'tests/test_m8_1a_origin.py'
      - '.github/workflows/m8_1a_native_origin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-and-frozen-source-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install base and test requirements
        run: python -m pip install -e '.[dev]'
      - name: Run all original M6 plus M8.0 plus new M8.1a tests
        run: python -m pytest -q
      - name: Execute 64 source seed worlds with three paired modes each, 200 native ticks
        run: python -m tools.m8_1a_native_origin
      - name: Upload complete first-origin and all native event trails (including nulls)
        uses: actions/upload-artifact@v4
        with:
          name: m8-1a-preregistered-64-seeds-192-worlds-all-native-traces
          path: |
            campaigns/m8_1a/protocol.json
            campaigns/m8_1a/results.json
            reports/M8_1a_results.md
          if-no-files-found: error
