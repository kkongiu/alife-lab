name: M7.5 independent posthoc physical source-cohort replay

on:
  push:
    branches:
      - exp/m7-5-mature-network-cohorts
    paths:
      - 'tools/m7_5_posthoc_independent_replay.py'
      - '.github/workflows/m7_5_posthoc_replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Read FROZEN original preregistered 320-source result artifact, not a newly chosen sample
        uses: actions/download-artifact@v4
        with:
          name: m7-5-mature-native-cohort-complete-results
          run-id: 43963759908
          github-token: ${{ github.token }}
          path: campaigns/m7_5_mature
      - name: Independently replay all 320 source states and 960 forks with ORIGINAL M7.3 transport
        run: python -m tools.m7_5_posthoc_independent_replay
      - name: Preserve posthoc physical validation, kept separate from frozen preregistered data
        uses: actions/upload-artifact@v4
        with:
          name: m7-5-posthoc-320-source-independent-replay
          path: campaigns/m7_5_mature/posthoc_independent_replay.json
          if-no-files-found: error
