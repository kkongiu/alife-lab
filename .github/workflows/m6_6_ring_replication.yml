name: M6.6 independent ring fork replication

on:
  push:
    branches:
      - exp/m6-6-independent-ring-fork-replication
    paths:
      - 'campaigns/m6_6_ring_replication/**'
      - 'tools/m6_6_ring_replication.py'
      - 'tests/test_m6_6_ring_replication.py'
      - '.github/workflows/m6_6_ring_replication.yml'
  pull_request:
    paths:
      - 'campaigns/m6_6_ring_replication/**'
      - 'tools/m6_6_ring_replication.py'
      - 'tests/test_m6_6_ring_replication.py'
      - '.github/workflows/m6_6_ring_replication.yml'

permissions:
  contents: read

jobs:
  replicate-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source project and tests
        run: python -m pip install -e '.[dev]'
      - name: Full test regression suite
        run: python -m pytest -q
      - name: Run frozen 40-world independent replication
        run: python -m tools.m6_6_ring_replication
      - name: Archive all source worlds and paired fork trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-6-independent-ring-replication
          path: campaigns/m6_6_ring_replication/results.json
          if-no-files-found: warn
