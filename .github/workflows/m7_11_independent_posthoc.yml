name: M7.11 parallel independent original native source and full physical fork replay

on:
  push:
    branches:
      - exp/m7-11-native-cyclic-fault-tolerance
    paths:
      - 'tools/m7_11_independent_posthoc.py'
      - 'tools/m7_11_independent_shards.py'
      - 'tests/test_m7_11_independent_posthoc.py'
      - '.github/workflows/m7_11_independent_posthoc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-unit-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify independent native M6 ring and refunded-edge original M7.3 transfer oracles
        run: python -m pytest -q tests/test_m7_11_independent_posthoc.py

  complete-independent-shards:
    needs: independent-unit-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 29001
            end: 29040
          - start: 29041
            end: 29080
          - start: 29081
            end: 29120
          - start: 29121
            end: 29160
          - start: 29161
            end: 29200
          - start: 29201
            end: 29240
          - start: 29241
            end: 29280
          - start: 29281
            end: 29320
          - start: 29321
            end: 29360
          - start: 29361
            end: 29400
          - start: 29401
            end: 29440
          - start: 29441
            end: 29480
          - start: 29481
            end: 29520
          - start: 29521
            end: 29560
          - start: 29561
            end: 29600
          - start: 29601
            end: 29640
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Read EXACT same already archived original 640-world results
        uses: actions/download-artifact@v4
        with:
          name: m7-11-complete-640-native-aged-rings-fault-tolerance
          run-id: 44171645566
          github-token: ${{ github.token }}
          path: campaigns/m7_11_ring_resilience
      - name: Rebuild 40 original natural worlds and all eligible four-arm physical followups independently
        run: python -m tools.m7_11_independent_shards shard --start ${{ matrix.start }} --end ${{ matrix.end }}
      - name: Preserve all 40 independent source-age and fork physical checks per shard
        uses: actions/upload-artifact@v4
        with:
          name: m7-11-independent-original-native-shard-${{ matrix.start }}-${{ matrix.end }}
          path: campaigns/m7_11_ring_resilience/independent_shards/${{ matrix.start }}-${{ matrix.end }}.json
          if-no-files-found: error

  merge-independent-audit:
    needs: complete-independent-shards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: m7-11-independent-original-native-shard-*
          path: campaigns/m7_11_ring_resilience/independent_shards
          merge-multiple: true
      - name: Demand all 16 independently reconstructed shards, 640 worlds, 626 natural rings and 2504 physical forks
        run: python -m tools.m7_11_independent_shards merge
      - name: Preserve independent same-sample native material fault tolerance verification
        uses: actions/upload-artifact@v4
        with:
          name: m7-11-independent-all-640-native-sources-and-2504-forks
          path: campaigns/m7_11_ring_resilience/posthoc_independent_physics_parallel.json
          if-no-files-found: error
