name: M6.12 natural seven-edge precursors and resident confinement

on:
  push:
    branches:
      - exp/m6-12-native-precursor-controls
    paths:
      - 'campaigns/m6_12_precursors/**'
      - 'tools/m6_12_precursors.py'
      - 'tests/test_m6_12_precursors.py'
      - '.github/workflows/m6_12_precursors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precursor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run complete regression suite, including seven-edge controls
        run: python -m pytest -q
      - name: Run the preregistered 300 native-world experiment
        run: python -m tools.m6_12_precursors
      - name: Archive all worlds, including negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-12-native-seven-edge-results
          path: campaigns/m6_12_precursors/results.json
          if-no-files-found: warn
