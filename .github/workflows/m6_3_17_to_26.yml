name: M6.3-17 to 26 reactive terminal chemistry

on:
  push:
    branches:
      - exp/m6-3-17-to-26-reactive-termini
    paths:
      - 'campaigns/m6_3_17_to_26/**'
      - 'tools/m6_3_17_to_26.py'
      - 'tests/test_m6_3_17_to_26.py'
      - '.github/workflows/m6_3_17_to_26.yml'
  pull_request:
    paths:
      - 'campaigns/m6_3_17_to_26/**'
      - 'tools/m6_3_17_to_26.py'
      - 'tests/test_m6_3_17_to_26.py'
      - '.github/workflows/m6_3_17_to_26.yml'

permissions:
  contents: read

jobs:
  terminal-chemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete pytest regressions
        run: python -m pytest -q
      - name: Execute frozen 144-world reactive terminal screen
        run: python -m tools.m6_3_17_to_26
      - name: Archive all 144 worlds including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-3-17-to-26-reactive-termini
          path: campaigns/m6_3_17_to_26/results.json
          if-no-files-found: warn
