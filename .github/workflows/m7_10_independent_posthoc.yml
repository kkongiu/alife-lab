name: M7.10 independent posthoc native M6/M7.3 source and recruited-bond physical replay

on:
  push:
    branches:
      - exp/m7-10-recruited-bond-function
    paths:
      - 'tools/m7_10_independent_posthoc.py'
      - 'tests/test_m7_10_independent_posthoc.py'
      - '.github/workflows/m7_10_independent_posthoc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-native-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Independent source, refunded-first-edge and conduction-suppression native physics regression tests
        run: python -m pytest -q tests/test_m7_10_independent_posthoc.py
      - name: Download FROZEN completed M7.10 primary dataset, no new random seed sampling
        uses: actions/download-artifact@v4
        with:
          name: m7-10-complete-first-native-bond-functional-results
          run-id: 44165823040
          github-token: ${{ github.token }}
          path: campaigns/m7_10_functional
      - name: Rebuild original 640 worlds and independently replay every recruited native link intervention
        run: python -m tools.m7_10_independent_posthoc
      - name: Preserve independent native physical 640-selection and 3-way-fork validation
        uses: actions/upload-artifact@v4
        with:
          name: m7-10-independent-640-native-source-and-full-fork-replay
          path: campaigns/m7_10_functional/posthoc_independent_physics.json
          if-no-files-found: error
