name: M7.9 independent original native M6 chemistry and permutation reconstruction audit

on:
  push:
    branches:
      - exp/m7-9-matched-root-energy-placement
    paths:
      - 'tools/m7_9_original_M6_oracle_audit.py'
      - 'tests/test_m7_9_original_M6_oracle_audit.py'
      - '.github/workflows/m7_9_original_M6_oracle_audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Test independent root permutation plus original native M6 form_bonds oracle
        run: python -m pytest -q tests/test_m7_9_original_M6_oracle_audit.py
      - name: Read FROZEN completed 640-source dataset (not new selected seed worlds)
        uses: actions/download-artifact@v4
        with:
          name: m7-9-complete-640-root-energy-placement-results
          run-id: 44121359723
          github-token: ${{ github.token }}
          path: campaigns/m7_9_placement
      - name: Rebuild all 640 native parents and 2560 root permutations; audit all formative source comparisons via original native M6 code
        run: python -m tools.m7_9_original_M6_oracle_audit
      - name: Archive independent posthoc full-state correctness and native original-chemistry checks
        uses: actions/upload-artifact@v4
        with:
          name: m7-9-independent-original-M6-posthoc-audit
          path: campaigns/m7_9_placement/posthoc_original_M6_oracle.json
          if-no-files-found: error
