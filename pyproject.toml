[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alife-lab"
version = "0.1.0"
description = "Laboratorio di vita artificiale: motore fisico locale, riproducibile e headless (M1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alife = "alife.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
